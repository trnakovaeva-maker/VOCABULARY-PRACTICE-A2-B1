<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>A2 vocabulary practice</title>
<meta name="description" content="Study and practise the 872 A2 words of the Oxford 3000 in sets of about 50, with Czech translations, example sentences, flashcards and exercises.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#eef1f4; --surface:#ffffff; --ink:#14202e; --muted:#566576; --line:#d3dae2;
  --accent:#0e5a6b; --accent-ink:#ffffff; --accent-soft:#d9ebef;
  --mark:#ffe3a0; --good:#1d7a3c; --good-soft:#dff1e4; --bad:#b3342b; --bad-soft:#f9e1de;
  --focus:#e08a00;
  --radius:10px;
  --font:'Atkinson Hyperlegible', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#0e1620; --surface:#17222f; --ink:#e8eef4; --muted:#9aa9b8; --line:#2a3846;
    --accent:#5bc0d6; --accent-ink:#06222a; --accent-soft:#16323b;
    --mark:#5a4a14; --good:#6ccb8a; --good-soft:#143323; --bad:#f28b82; --bad-soft:#3a1a18;
    --focus:#ffb938;
  }
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:17px;line-height:1.5}
a{color:var(--accent)}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px;border-radius:4px}
h1,h2,h3{line-height:1.15;margin:0}
h1:focus{outline:none}
h1{font-size:clamp(2rem,5vw,2.9rem);font-weight:700;letter-spacing:-.02em}
h2{font-size:1.35rem;font-weight:700;letter-spacing:-.01em}
p{margin:0}
.wrap{max-width:1040px;margin:0 auto;padding:1.5rem 1rem 4rem}
header.top{display:flex;align-items:center;justify-content:space-between;gap:1rem;padding:.9rem 1rem;max-width:1040px;margin:0 auto}
header.top a.brand{font-weight:700;text-decoration:none;color:var(--ink);font-size:1.05rem}
header.top .sub{color:var(--muted);font-size:.92rem}
.lead{max-width:60ch;color:var(--muted);margin-top:.8rem;font-size:1.05rem}
.muted{color:var(--muted)}
.back{display:inline-block;margin-bottom:1rem;text-decoration:none;font-weight:700}
.back:hover{text-decoration:underline}

/* buttons */
.btn{font:inherit;font-weight:700;cursor:pointer;border-radius:var(--radius);padding:.65rem 1.1rem;border:2px solid var(--accent);background:var(--accent);color:var(--accent-ink);text-decoration:none;display:inline-block;line-height:1.2}
.btn:hover{filter:brightness(1.08)}
.btn.ghost{background:transparent;color:var(--accent)}
.btn.ghost:hover{background:var(--accent-soft);filter:none}
.btn[aria-pressed="true"]{background:var(--accent-soft);color:var(--ink);border-color:var(--accent)}
.btn.small{padding:.4rem .75rem;font-size:.95rem}
.row{display:flex;flex-wrap:wrap;gap:.6rem;align-items:center}
.icon-btn{font:inherit;cursor:pointer;border:1px solid var(--line);background:var(--surface);color:var(--accent);width:2.3rem;height:2.3rem;border-radius:50%;display:inline-grid;place-items:center;flex:none;padding:0}
.icon-btn:hover{background:var(--accent-soft)}
.icon-btn svg{width:1.15rem;height:1.15rem;fill:currentColor}

/* progress dots: one dot per word */
.dots{display:grid;grid-template-columns:repeat(25,1fr);gap:3px}
.dot{width:100%;aspect-ratio:1;border-radius:50%;border:1.5px solid var(--muted);background:transparent;display:block}
.legend .dot{width:9px}
.dot[data-l="1"]{background:color-mix(in srgb,var(--accent) 35%,transparent);border-color:var(--accent)}
.dot[data-l="2"]{background:color-mix(in srgb,var(--accent) 70%,transparent);border-color:var(--accent)}
.dot[data-l="3"]{background:var(--accent);border-color:var(--accent)}
.dots.big{display:flex;flex-wrap:wrap;gap:5px}
.dots.big .dot{width:14px;height:14px}
.legend{display:flex;flex-wrap:wrap;gap:.9rem;color:var(--muted);font-size:.9rem;margin-top:.6rem;align-items:center}
.legend span{display:inline-flex;align-items:center;gap:.35rem}

/* home */
.overall{margin-top:1.4rem;max-width:34rem}
.bar{height:8px;background:var(--line);border-radius:99px;overflow:hidden;margin-top:.45rem}
.bar>i{display:block;height:100%;background:var(--accent);width:0}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:.9rem;margin-top:2rem}
.tile{display:flex;flex-direction:column;gap:.7rem;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:1rem 1.1rem;text-decoration:none;color:var(--ink)}
.tile:hover{border-color:var(--accent)}
.tile .n{font-size:1.5rem;font-weight:700;letter-spacing:-.01em}
.tile .range{color:var(--muted);font-size:.92rem}
.tile .teaser{color:var(--muted);font-size:.92rem;font-style:italic}
.tile .foot{font-size:.92rem}
.tile-head{display:flex;justify-content:space-between;align-items:baseline;gap:.5rem}

/* set page */
.step{margin-top:2.4rem}
.step>h2{display:flex;align-items:center;gap:.7rem}
.step .num{display:inline-grid;place-items:center;width:1.9rem;height:1.9rem;border-radius:50%;background:var(--accent);color:var(--accent-ink);font-size:1rem}
.step p.hint{color:var(--muted);margin:.5rem 0 1rem;max-width:62ch}
.list{list-style:none;margin:1.2rem 0 0;padding:0;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden}
.wrow{display:grid;grid-template-columns:2.6rem minmax(9rem,1.1fr) minmax(8rem,1fr) 1.9fr;gap:.2rem .9rem;align-items:center;padding:.65rem .9rem;border-top:1px solid var(--line)}
.wrow:first-child{border-top:0}
.wrow .en b{font-size:1.1rem}
.wrow .en small{color:var(--muted);font-style:italic;margin-left:.35rem}
.wrow .en .note{font-style:normal}
.wrow .sent{color:var(--ink)}
mark{background:var(--mark);color:inherit;border-radius:3px;padding:0 .15em}
.hide-en .en .txt,.hide-cz .cz .txt{filter:blur(7px);cursor:pointer;user-select:none}
.hide-en .en.revealed .txt,.hide-cz .cz.revealed .txt{filter:none;user-select:auto}
@media (max-width:700px){
  .wrow{grid-template-columns:2.6rem 1fr;grid-template-areas:"a b" ". c" ". d"}
  .wrow>:nth-child(1){grid-area:a}.wrow>:nth-child(2){grid-area:b}.wrow>:nth-child(3){grid-area:c}.wrow>:nth-child(4){grid-area:d}
}
.modes{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:.8rem;margin-top:1rem}
.mode{display:block;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:.9rem 1rem;text-decoration:none;color:var(--ink)}
.mode:hover{border-color:var(--accent)}
.mode b{display:block;font-size:1.05rem;margin-bottom:.2rem}
.mode span{color:var(--muted);font-size:.95rem}

/* flashcards */
.stage{max-width:640px;margin:1.2rem 0 0}
.cardwrap{perspective:1200px}
.card{position:relative;width:100%;min-height:290px;border:0;background:none;padding:0;cursor:pointer;font:inherit;color:inherit;text-align:center;display:block}
.card .face{position:absolute;inset:0;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:1.4rem;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.7rem;backface-visibility:hidden;box-shadow:0 10px 28px -14px rgba(20,32,46,.45)}
.card .rear{transform:rotateY(180deg)}
.card{transform-style:preserve-3d;transition:transform .35s}
.card.flipped{transform:rotateY(180deg)}
@media (prefers-reduced-motion:reduce){.card{transition:none}}
.card .big{font-size:clamp(2rem,7vw,3rem);font-weight:700;letter-spacing:-.02em}
.card .pos{color:var(--muted);font-style:italic}
.card .cz-big{font-size:clamp(1.6rem,5vw,2.2rem);font-weight:700}
.card .ex{font-size:1.05rem;max-width:32ch}
.cardbar{display:flex;gap:.7rem;margin-top:1rem;flex-wrap:wrap}
.cardbar .btn{flex:1 1 9rem}
.btn.bad{background:var(--bad-soft);color:var(--bad);border-color:var(--bad)}
.btn.good{background:var(--good-soft);color:var(--good);border-color:var(--good)}
.progress{font-weight:700;color:var(--muted);margin-bottom:.5rem}

/* exercises */
.q{max-width:680px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:1.4rem;margin-top:1rem}
.qprompt{font-size:clamp(1.6rem,5vw,2.3rem);font-weight:700;letter-spacing:-.01em;display:flex;align-items:center;gap:.7rem;flex-wrap:wrap}
.qprompt small{font-size:1rem;color:var(--muted);font-weight:400;font-style:italic}
.qsent{font-size:1.4rem;line-height:1.4}
.blank{display:inline-block;min-width:4.5ch;border-bottom:3px solid var(--accent);margin:0 .1em;vertical-align:baseline}
.qhelp{color:var(--muted);margin-top:.5rem}
.opts{display:grid;gap:.6rem;margin-top:1.1rem}
.opt{font:inherit;text-align:left;cursor:pointer;background:var(--bg);color:var(--ink);border:2px solid var(--line);border-radius:var(--radius);padding:.7rem .9rem;display:flex;gap:.7rem;align-items:center}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt .k{display:inline-grid;place-items:center;width:1.6rem;height:1.6rem;border-radius:6px;background:var(--surface);border:1px solid var(--line);font-size:.85rem;color:var(--muted);flex:none}
.opt.right{background:var(--good-soft);border-color:var(--good)}
.opt.wrong{background:var(--bad-soft);border-color:var(--bad)}
.opt:disabled{cursor:default}
.typeform{display:flex;gap:.6rem;margin-top:1.1rem;flex-wrap:wrap}
.typeform input{font:inherit;font-size:1.2rem;flex:1 1 12rem;padding:.6rem .8rem;border:2px solid var(--line);border-radius:var(--radius);background:var(--bg);color:var(--ink);min-width:0}
.typeform input:focus{border-color:var(--accent);outline:none}
.typeform input.right{border-color:var(--good);background:var(--good-soft)}
.typeform input.wrong{border-color:var(--bad);background:var(--bad-soft)}
.fb{margin-top:1.1rem;border-radius:var(--radius);padding:.9rem 1rem}
.fb.right{background:var(--good-soft);border-left:5px solid var(--good)}
.fb.wrong{background:var(--bad-soft);border-left:5px solid var(--bad)}
.fb .head{font-weight:700;margin-bottom:.3rem}
.fb.right .head{color:var(--good)}.fb.wrong .head{color:var(--bad)}
.fb .line{margin:.2rem 0}
.fb .row{margin-top:.8rem}
.qbar{display:flex;justify-content:space-between;color:var(--muted);font-weight:700;margin-bottom:.4rem;max-width:680px}
.prog{max-width:680px}
.result{max-width:680px}
.score{font-size:clamp(2.4rem,8vw,3.6rem);font-weight:700;letter-spacing:-.02em}
.missed{list-style:none;padding:0;margin:1rem 0;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius)}
.missed li{padding:.6rem .9rem;border-top:1px solid var(--line);display:flex;gap:.6rem;align-items:center;flex-wrap:wrap}
.missed li:first-child{border-top:0}
footer{max-width:1040px;margin:0 auto;padding:0 1rem 3rem;color:var(--muted);font-size:.88rem}
footer p{max-width:70ch;margin-bottom:.5rem}
footer button{font:inherit;background:none;border:0;color:var(--muted);text-decoration:underline;cursor:pointer;padding:0}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
</style>
</head>

const SET_COUNT = 18;
const SETS = (function(){
  const n = WORDS.length, base = Math.floor(n / SET_COUNT), extra = n % SET_COUNT;
  let i = 0; const out = [];
  for (let s = 0; s < SET_COUNT; s++){ const size = base + (s < extra ? 1 : 0); out.push(WORDS.slice(i, i + size)); i += size; }
  return out;
})();

/* ---------- progress (localStorage, safe) ---------- */
const KEY = 'a2vocab.v1';
let data = { scores: {}, last: null };
try { const t = localStorage.getItem(KEY); if (t){ const d = JSON.parse(t); if (d && typeof d === 'object') data = { scores: d.scores || {}, last: d.last || null }; } } catch(e){}
function save(){ try { localStorage.setItem(KEY, JSON.stringify(data)); } catch(e){} }
const score = w => data.scores[w.id] || 0;
function bump(w, ok){ const s = score(w); data.scores[w.id] = ok ? Math.min(3, s + 1) : Math.max(0, s - 1); save(); }
function known(list){ return list.filter(w => score(w) >= 3).length; }

/* ---------- helpers ---------- */
function el(tag, props, ...kids){
  const n = document.createElement(tag);
  if (props) for (const k in props){
    const v = props[k]; if (v == null || v === false) continue;
    if (k === 'class') n.className = v;
    else if (k === 'text') n.textContent = v;
    else if (k.slice(0,2) === 'on') n.addEventListener(k.slice(2), v);
    else n.setAttribute(k, v === true ? '' : v);
  }
  for (const kid of kids.flat()){ if (kid == null || kid === false) continue; n.append(kid.nodeType ? kid : document.createTextNode(kid)); }
  return n;
}
function shuffle(a){ a = a.slice(); for (let i = a.length - 1; i > 0; i--){ const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
const escRe = s => s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
const norm = s => s.toLowerCase().replace(/[’`]/g, "'").replace(/\s+/g, ' ').trim();
function pieces(sent, form){
  if (!form) return [sent];
  const re = new RegExp("(^|[^A-Za-z'])(" + escRe(form) + ")(?![A-Za-z'])", 'gi');
  const out = []; let last = 0;
  sent.replace(re, function(m, pre, hit, off){ const st = off + pre.length; out.push(sent.slice(last, st)); out.push({ hit: hit }); last = st + hit.length; return m; });
  out.push(sent.slice(last));
  return out;
}
function sentenceWithMark(w){ return el('span', null, pieces(w.sent, w.form).map(p => typeof p === 'string' ? p : el('mark', { text: p.hit }))); }
function sentenceWithBlank(w){ return el('span', null, pieces(w.sent, w.form).map(p => typeof p === 'string' ? p : el('span', { class: 'blank', 'aria-label': 'blank' }))); }

const canSpeak = 'speechSynthesis' in window && 'SpeechSynthesisUtterance' in window;
let voice = null;
function pickVoice(){ if (!canSpeak) return; const vs = speechSynthesis.getVoices(); voice = vs.find(v => /en[-_]GB/i.test(v.lang)) || vs.find(v => /^en/i.test(v.lang)) || null; }
if (canSpeak){ pickVoice(); speechSynthesis.onvoiceschanged = pickVoice; }
function speak(text, rate){ if (!canSpeak) return; try { speechSynthesis.cancel(); const u = new SpeechSynthesisUtterance(text); u.lang = 'en-GB'; if (voice) u.voice = voice; u.rate = rate || 0.9; speechSynthesis.speak(u); } catch(e){} }
function speakBtn(text, label){
  if (!canSpeak) return null;
  const b = el('button', { class: 'icon-btn', type: 'button', 'aria-label': label || ('Listen: ' + text), title: 'Listen' });
  b.innerHTML = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 10v4h4l5 4V6L7 10H3zm13.5 2a4.5 4.5 0 0 0-2.5-4.03v8.05A4.5 4.5 0 0 0 16.5 12zM14 3.23v2.06a7 7 0 0 1 0 13.42v2.06A9 9 0 0 0 14 3.23z"/></svg>';
  b.addEventListener('click', e => { e.stopPropagation(); speak(text); });
  return b;
}
function dots(list, big){
  return el('div', { class: 'dots' + (big ? ' big' : ''), role: 'img', 'aria-label': known(list) + ' of ' + list.length + ' words known' },
    list.map(w => el('i', { class: 'dot', 'data-l': score(w), title: big ? w.head + ' - ' + w.cz : null })));
}
function wordLabel(w){ return w.head + (w.note ? ' (' + w.note + ')' : ''); }

const app = document.getElementById('app');
let cleanup = null;
function stopView(){ if (cleanup){ cleanup(); cleanup = null; } if (canSpeak) try { speechSynthesis.cancel(); } catch(e){} }
function mount(title, ...nodes){
  app.replaceChildren(...nodes.flat().filter(Boolean));
  document.title = title + ' - A2 vocabulary';
  const h = app.querySelector('h1'); if (h){ h.setAttribute('tabindex', '-1'); h.focus({ preventScroll: true }); }
  window.scrollTo(0, 0);
}
const setHref = n => '#/set/' + n;
const rangeText = list => 'words ' + list[0].id + ' to ' + list[list.length - 1].id;

/* ---------- home ---------- */
function home(){
  const total = WORDS.length, k = known(WORDS);
  const tiles = SETS.map((list, i) => {
    const n = i + 1;
    return el('a', { class: 'tile', href: setHref(n) },
      el('div', { class: 'tile-head' }, el('span', { class: 'n', text: 'Set ' + n }), el('span', { class: 'range', text: rangeText(list) })),
      dots(list, false),
      el('div', { class: 'foot', text: known(list) + ' of ' + list.length + ' known' }),
      el('div', { class: 'teaser', text: list.slice(0, 5).map(w => w.head).join(', ') + '...' }));
  });
  const cont = data.last ? el('a', { class: 'btn', href: setHref(data.last), text: 'Continue with set ' + data.last }) : null;
  mount('All sets',
    el('h1', { text: 'A2 vocabulary' }),
    el('p', { class: 'lead', text: total + ' words, from the most common to the least common. Pick a set of about 50 words, study it, then practise with exercises.' }),
    el('div', { class: 'overall' },
      el('div', { text: k + ' of ' + total + ' words known' }),
      el('div', { class: 'bar', role: 'progressbar', 'aria-valuemin': 0, 'aria-valuemax': total, 'aria-valuenow': k }, el('i', { style: 'width:' + (100 * k / total).toFixed(1) + '%' }))),
    el('div', { class: 'row', style: 'margin-top:1.2rem' }, cont),
    el('div', { class: 'legend', 'aria-label': 'Dot legend' },
      el('span', null, el('i', { class: 'dot', 'data-l': 0 }), 'new'),
      el('span', null, el('i', { class: 'dot', 'data-l': 1 }), 'seen'),
      el('span', null, el('i', { class: 'dot', 'data-l': 2 }), 'getting there'),
      el('span', null, el('i', { class: 'dot', 'data-l': 3 }), 'known')),
    el('div', { class: 'grid' }, tiles));
}

};
let pendingDeck = null;

function setPage(n){
  data.last = n; save();
  const list = SETS[n - 1];
  const listEl = el('ul', { class: 'list' }, list.map(w => {
    const en = el('div', { class: 'en' }, el('span', { class: 'txt' }, el('b', { text: w.head }), w.note ? el('small', { class: 'note', text: '(' + w.note + ')' }) : null, el('small', { text: w.pos })));
    const cz = el('div', { class: 'cz' }, el('span', { class: 'txt', text: w.cz }));
    [en, cz].forEach(c => c.addEventListener('click', () => c.classList.toggle('revealed')));
    return el('li', { class: 'wrow' }, speakBtn(w.head, 'Listen: ' + w.head) || el('span'), en, cz, el('div', { class: 'sent' }, sentenceWithMark(w)));
  }));
  const hideEn = el('button', { class: 'btn ghost small', type: 'button', 'aria-pressed': 'false', text: 'Hide English' });
  const hideCz = el('button', { class: 'btn ghost small', type: 'button', 'aria-pressed': 'false', text: 'Hide Czech' });
  function toggle(btn, cls){
    const on = btn.getAttribute('aria-pressed') !== 'true';
    btn.setAttribute('aria-pressed', on);
    listEl.classList.toggle(cls, on);
    if (!on) listEl.querySelectorAll('.revealed').forEach(c => c.classList.remove('revealed'));
  }
  hideEn.addEventListener('click', () => toggle(hideEn, 'hide-en'));
  hideCz.addEventListener('click', () => toggle(hideCz, 'hide-cz'));
  const modes = Object.keys(MODES).filter(m => m !== 'listen' || canSpeak).map(m =>
    el('a', { class: 'mode', href: setHref(n) + '/ex/' + m }, el('b', { text: MODES[m].title }), el('span', { text: MODES[m].desc })));
  mount('Set ' + n,
    el('a', { class: 'back', href: '#/', text: 'All sets' }),
    el('h1', { text: 'Set ' + n }),
    el('p', { class: 'lead', text: rangeText(list).replace(/^w/, 'W') + ' of ' + WORDS.length }),
    el('div', { style: 'margin-top:1rem' }, dots(list, true)),
    el('section', { class: 'step' },
      el('h2', null, el('span', { class: 'num', text: '1' }), 'Study the words'),
      el('p', { class: 'hint', text: 'Read each word, listen to it and read the example. Then hide a column and test yourself: click a blurred word to check it.' }),
      el('div', { class: 'row' }, el('a', { class: 'btn', href: setHref(n) + '/cards', text: 'Flashcards' }), hideEn, hideCz),
      listEl),
    el('section', { class: 'step' },
      el('h2', null, el('span', { class: 'num', text: '2' }), 'Practise'),
      el('p', { class: 'hint', text: 'Each round has 10 questions. Words you do not know yet come up more often.' }),
      el('div', { class: 'modes' }, modes)));
}

/* ---------- flashcards ---------- */
function cards(n){
  data.last = n; save();
  const full = SETS[n - 1];
  let deck = pendingDeck && pendingDeck.length ? pendingDeck : full.slice();
  pendingDeck = null;
  let i = 0, flipped = false; const missed = [];
  const box = el('div');
  function onKey(e){
    if (e.target && /input|textarea/i.test(e.target.tagName)) return;
    if (e.key === ' ' || e.key === 'Enter'){ if (e.target && e.target.tagName === 'BUTTON' && !e.target.classList.contains('card')) return; e.preventDefault(); flip(); }
    else if (flipped && (e.key === 'ArrowLeft' || e.key === '1')) answer(false);
    else if (flipped && (e.key === 'ArrowRight' || e.key === '2')) answer(true);
  }
  document.addEventListener('keydown', onKey);
  cleanup = () => document.removeEventListener('keydown', onKey);
  function flip(){ flipped = !flipped; const c = box.querySelector('.card'); if (c){ c.classList.toggle('flipped', flipped); c.setAttribute('aria-pressed', flipped); } const bar = box.querySelector('.cardbar'); if (bar) bar.hidden = !flipped; const hint = box.querySelector('.fliphint'); if (hint) hint.hidden = flipped; }
  function answer(ok){ const w = deck[i]; bump(w, ok); if (!ok) missed.push(w); i++; flipped = false; render(); }
  function render(){
    if (i >= deck.length) return done();
    const w = deck[i];
    const card = el('button', { class: 'card', type: 'button', 'aria-pressed': 'false', 'aria-label': 'Flashcard ' + wordLabel(w) + '. Press to flip.', onclick: flip },
      el('span', { class: 'face front' }, el('span', { class: 'big', text: w.head }), w.note ? el('span', { class: 'pos', text: '(' + w.note + ')' }) : null, el('span', { class: 'pos', text: w.pos })),
      el('span', { class: 'face rear' }, el('span', { class: 'cz-big', text: w.cz }), el('span', { class: 'ex' }, sentenceWithMark(w))));
    box.replaceChildren(
      el('div', { class: 'progress', 'aria-live': 'polite', text: 'Card ' + (i + 1) + ' of ' + deck.length }),
      el('div', { class: 'row', style: 'margin-bottom:.6rem' }, speakBtn(w.head, 'Listen: ' + w.head), canSpeak ? el('button', { class: 'btn ghost small', type: 'button', text: 'Listen to the example', onclick: () => speak(w.sent) }) : null),
      el('div', { class: 'cardwrap' }, card),
      el('p', { class: 'muted fliphint', style: 'margin-top:.8rem', text: 'Click the card or press space to see the meaning.' }),
      el('div', { class: 'cardbar', hidden: true },
        el('button', { class: 'btn bad', type: 'button', text: 'Still learning', onclick: () => answer(false) }),
        el('button', { class: 'btn good', type: 'button', text: 'I know it', onclick: () => answer(true) })));
    card.focus({ preventScroll: true });
  }
  function done(){
    const again = missed.length ? el('button', { class: 'btn', type: 'button', text: 'Repeat the ' + missed.length + ' words I missed', onclick: () => { pendingDeck = missed.slice(); route(); } }) : null;
    box.replaceChildren(
      el('h2', { text: missed.length ? 'Deck finished' : 'All cards known' }),
      el('p', { class: 'lead', text: (deck.length - missed.length) + ' of ' + deck.length + ' cards marked as known.' }),
      el('div', { class: 'row', style: 'margin-top:1.2rem' }, again, el('a', { class: 'btn ' + (again ? 'ghost' : ''), href: setHref(n) + '/ex/meaning', text: 'Start exercises' }), el('a', { class: 'btn ghost', href: setHref(n), text: 'Back to set ' + n })));
  }
  mount('Flashcards, set ' + n,
    el('a', { class: 'back', href: setHref(n), text: 'Set ' + n }),
    el('h1', { text: 'Flashcards' }),
    el('div', { class: 'stage' }, box));
  render();
}

/* ---------- exercises ---------- */
function exercise(n, mode){
  data.last = n; save();
  const set = SETS[n - 1];
  if (mode === 'listen' && !canSpeak){ location.hash = setHref(n); return; }
  const pool = mode === 'gap' ? set.filter(w => w.form) : set;
  const count = Math.min(10, pool.length);
  const picked = shuffle(pool.map(w => ({ w: w, k: score(w) + Math.random() * 1.6 })).sort((a, b) => a.k - b.k).slice(0, count).map(x => x.w));
  let i = 0; const results = [];
  const box = el('div');
  cleanup = null;

  function distractors(w, key, cnt){
    const ok = set.filter(x => x.id !== w.id && x.cz !== w.cz && norm(x.head) !== norm(w.head));
    const same = shuffle(ok.filter(x => x.pos === w.pos)), rest = shuffle(ok.filter(x => x.pos !== w.pos));
    return same.concat(rest).slice(0, cnt);
  }
  function finish(w, ok, given){
    bump(w, ok); results.push({ w: w, ok: ok, given: given });
  }
  function feedback(w, ok, extra){
    const last = i === picked.length - 1;
    const fb = el('div', { class: 'fb ' + (ok ? 'right' : 'wrong'), 'aria-live': 'polite' },
      el('div', { class: 'head', text: ok ? 'Correct' : 'Not quite' }),
      extra,
      el('div', { class: 'line' }, el('b', { text: wordLabel(w) }), ' ' + w.pos + ' - ' + w.cz),
      el('div', { class: 'line' }, sentenceWithMark(w)),
      el('div', { class: 'row' }, speakBtn(w.sent, 'Listen to the sentence'),
        el('button', { class: 'btn', type: 'button', id: 'next', text: last ? 'See results' : 'Next question', onclick: () => { i++; render(); } })));
    return fb;
  }
  function header(){
    return [el('div', { class: 'qbar' }, el('span', { text: 'Question ' + (i + 1) + ' of ' + picked.length }), el('span', { text: MODES[mode].title })),
      el('div', { class: 'bar prog', role: 'progressbar', 'aria-valuemin': 0, 'aria-valuemax': picked.length, 'aria-valuenow': i }, el('i', { style: 'width:' + (100 * i / picked.length) + '%' }))];
  }

  function choiceQ(w, fromEn){
    const opts = shuffle([w].concat(distractors(w, fromEn ? 'cz' : 'head', 3)));
    let answered = false;
    const q = el('div', { class: 'q' });
    const prompt = fromEn
      ? el('div', { class: 'qprompt' }, w.head, w.note ? el('small', { text: '(' + w.note + ')' }) : null, el('small', { text: w.pos }), speakBtn(w.head, 'Listen: ' + w.head))
      : el('div', { class: 'qprompt' }, w.cz, el('small', { text: w.pos + (w.note ? ', ' + w.note : '') }));
    const optsEl = el('div', { class: 'opts', role: 'group', 'aria-label': 'Answers' });
    const btns = opts.map((o, idx) => {
      const b = el('button', { class: 'opt', type: 'button' }, el('span', { class: 'k', text: String(idx + 1) }), el('span', { text: fromEn ? o.cz : o.head }));
      b.addEventListener('click', () => pick(o, b));
      return b;
    });
    optsEl.append(...btns);
    const fbSlot = el('div');
    q.append(el('div', { class: 'qhelp', text: fromEn ? 'What does this word mean?' : 'Which English word means this?' }), prompt, optsEl, fbSlot);
    function pick(o, b){
      if (answered) return; answered = true;
      const ok = o.id === w.id;
      btns.forEach((x, idx) => { x.disabled = true; if (opts[idx].id === w.id){ x.classList.add('right'); x.firstChild.textContent = '✓'; } });
      if (!ok){ b.classList.add('wrong'); b.firstChild.textContent = '✗'; }
      finish(w, ok, fromEn ? o.cz : o.head);
      fbSlot.replaceChildren(feedback(w, ok, null));
      fbSlot.querySelector('#next').focus();
    }
    const onKey = e => { const k = parseInt(e.key, 10); if (!answered && k >= 1 && k <= btns.length){ pick(opts[k - 1], btns[k - 1]); } };
    document.addEventListener('keydown', onKey);
    cleanup = () => document.removeEventListener('keydown', onKey);
    return q;
  }

  function typeQ(w){
    let answered = false;
    const accepted = mode === 'gap' ? [norm(w.form)] : mode === 'listen' ? [norm(w.head)] : set.filter(x => x.cz === w.cz).map(x => norm(x.head));
    const input = el('input', { type: 'text', autocomplete: 'off', autocapitalize: 'off', autocorrect: 'off', spellcheck: 'false', 'aria-label': 'Your answer', placeholder: 'Type the English word' });
    const hintBtn = el('button', { class: 'btn ghost small', type: 'button', text: 'Hint' });
    const hintOut = el('div', { class: 'qhelp', 'aria-live': 'polite' });
    const target = mode === 'gap' ? w.form : w.head;
    hintBtn.addEventListener('click', () => { hintOut.textContent = 'Starts with "' + target[0].toLowerCase() + '", ' + target.replace(/\s/g, '').length + ' letters.'; input.focus(); });
    const checkBtn = el('button', { class: 'btn', type: 'submit', text: 'Check' });
    const form = el('form', { class: 'typeform' }, input, checkBtn);
    const fbSlot = el('div');
    const q = el('div', { class: 'q' });
    if (mode === 'gap'){
      q.append(el('div', { class: 'qhelp', text: 'Type the missing word.' }), el('div', { class: 'qsent' }, sentenceWithBlank(w)),
        el('div', { class: 'qhelp', text: 'Czech: ' + w.cz + ' (' + w.pos + (w.note ? ', ' + w.note : '') + ')' }));
    } else if (mode === 'spell'){
      q.append(el('div', { class: 'qhelp', text: 'Write this in English.' }), el('div', { class: 'qprompt' }, w.cz, el('small', { text: w.pos + (w.note ? ', ' + w.note : '') })));
    } else {
      const play = el('button', { class: 'btn', type: 'button', text: 'Play the word', onclick: () => speak(w.head) });
      const slow = el('button', { class: 'btn ghost', type: 'button', text: 'Play slowly', onclick: () => speak(w.head, 0.55) });
      q.append(el('div', { class: 'qhelp', text: 'Listen and type the word you hear.' }), el('div', { class: 'row', style: 'margin-top:.8rem' }, play, slow));
      setTimeout(() => speak(w.head), 250);
    }
    q.append(form, el('div', { class: 'row', style: 'margin-top:.6rem' }, hintBtn), hintOut, fbSlot);
    form.addEventListener('submit', e => {
      e.preventDefault(); if (answered) return;
      const val = norm(input.value); if (!val){ input.focus(); return; }
      answered = true;
      const ok = accepted.includes(val);
      input.readOnly = true; checkBtn.disabled = true; hintBtn.disabled = true;
      input.classList.add(ok ? 'right' : 'wrong');
      finish(w, ok, input.value.trim());
      const extra = ok ? null : el('div', { class: 'line' }, 'You wrote: ', el('b', { text: input.value.trim() }), '. Correct answer: ', el('b', { text: target }), '.');
      fbSlot.replaceChildren(feedback(w, ok, extra));
      fbSlot.querySelector('#next').focus();
    });
    setTimeout(() => { if (!answered && mode !== 'listen') input.focus({ preventScroll: true }); }, 0);
    return q;
  }

  function render(){
    if (cleanup){ cleanup(); cleanup = null; }
    if (i >= picked.length) return results_();
    const w = picked[i];
    const q = mode === 'meaning' ? choiceQ(w, true) : mode === 'word' ? choiceQ(w, false) : typeQ(w);
    box.replaceChildren(...header(), q);
  }
  function results_(){
    const ok = results.filter(r => r.ok).length, miss = results.filter(r => !r.ok);
    const msg = ok === results.length ? 'Perfect round.' : ok >= results.length * 0.7 ? 'Good work.' : 'Keep going. These words will come back so you can practise them.';
    box.replaceChildren(
      el('div', { class: 'result' },
        el('div', { class: 'score', text: ok + ' / ' + results.length }),
        el('p', { class: 'lead', text: msg }),
        miss.length ? el('h2', { style: 'margin-top:1.4rem', text: 'Words to review' }) : null,
        miss.length ? el('ul', { class: 'missed' }, miss.map(r => el('li', null, speakBtn(r.w.head), el('b', { text: wordLabel(r.w) }), ' ' + r.w.cz, el('span', { class: 'muted' }, ' - ', sentenceWithMark(r.w))))) : null,
        el('div', { class: 'row', style: 'margin-top:1.2rem' },
          el('button', { class: 'btn', type: 'button', text: 'Another round', onclick: () => route() }),
          el('a', { class: 'btn ghost', href: setHref(n), text: 'Choose another exercise' }))));
  }
  mount(MODES[mode].title + ', set ' + n,
    el('a', { class: 'back', href: setHref(n), text: 'Set ' + n }),
    el('h1', { text: MODES[mode].title }), box);
  render();
}

/* ---------- router ---------- */
function route(){
  stopView();
  const parts = location.hash.replace(/^#\/?/, '').split('/').filter(Boolean);
  if (parts[0] === 'set'){
    const n = parseInt(parts[1], 10);
    if (n >= 1 && n <= SETS.length){
      if (!parts[2]) return setPage(n);
      if (parts[2] === 'cards') return cards(n);
      if (parts[2] === 'ex' && MODES[parts[3]]) return exercise(n, parts[3]);
    }
  }
  home();
}
window.addEventListener('hashchange', route);
document.getElementById('reset').addEventListener('click', () => {
  if (confirm('Delete all your saved progress in this browser?')){ data = { scores: {}, last: null }; save(); route(); }
});
route();
})();
</script>
